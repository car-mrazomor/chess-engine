[project]
name = "chess-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivan", email = "ivan@ivek.gg" }
]
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "dotenv>=0.9.9",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "questionary>=2.1.1",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "selectolax>=1.0.0",
    "torch>=2.14.1",
]

[project.scripts]
chess-engine = "chess_engine:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
